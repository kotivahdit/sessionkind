[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sessionkind"
version = "0.2.0"
description = "Passively tell whether the operator behind an SSH/shell session is a human, a script, or an LLM-driven agent."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [{name = "Kotivahdit", email = "kotivahdit@proton.me"}]
keywords = ["honeypot", "ssh", "llm", "ai-agent", "threat-detection",
            "incident-response", "cowrie", "dfir", "security"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Information Technology",
  "Topic :: Security",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
]
dependencies = []

[project.urls]
Homepage = "https://kotivahdit.github.io"
Source = "https://github.com/kotivahdit/sessionkind"

[project.scripts]
sessionkind = "sessionkind.cli:main"

[tool.setuptools]
packages = ["sessionkind"]
